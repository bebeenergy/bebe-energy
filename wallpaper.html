let shown = new Set();
let currentIdx = -1;

function getRandomIndex() {
  if (shown.size >= quotes.length) shown.clear();
  let idx;
  do { idx = Math.floor(Math.random() * quotes.length); }
  while (shown.has(idx));
  shown.add(idx);
  return idx;
}

function parseQuote(raw) {
  const marker = "I'm awesome.";
  const pos = raw.lastIndexOf(marker);
  if (pos === -1) return { body: raw, awesome: marker };
  return {
    body: raw.substring(0, pos).trim(),
    awesome: marker
  };
}

function showQuote(idx) {
  const qbody = document.getElementById('qbody');
  const qawesome = document.getElementById('qawesome');
  const qrule = document.getElementById('qrule');
  const qnum = document.getElementById('qnum');
  const qcount = document.getElementById('qcount');

  // Fade out
  qbody.classList.remove('visible');
  qawesome.classList.remove('visible');
  qrule.classList.remove('visible');

  setTimeout(() => {
    const { body, awesome } = parseQuote(quotes[idx]);
    qnum.textContent = String(idx + 1).padStart(3, '0');
    qbody.textContent = body;
    qcount.textContent = `— ${idx + 1} of 1000 —`;

    // Fade in
    requestAnimationFrame(() => {
      qrule.classList.add('visible');
      setTimeout(() => qbody.classList.add('visible'), 60);
      setTimeout(() => qawesome.classList.add('visible'), 120);
    });
  }, 350);
}

function nextQuote(e) {
  // Ripple
  const ripple = document.createElement('div');
  ripple.className = 'ripple';
  ripple.style.left = (e?.clientX ?? window.innerWidth/2) + 'px';
  ripple.style.top = (e?.clientY ?? window.innerHeight/2) + 'px';
  document.body.appendChild(ripple);
  setTimeout(() => ripple.remove(), 700);

  currentIdx = getRandomIndex();
  showQuote(currentIdx);
}

// Init
document.body.addEventListener('click', nextQuote);
document.addEventListener('keydown', e => {
  if (e.key === ' ' || e.key === 'ArrowRight') nextQuote(e);
});

// Show first quote immediately
currentIdx = getRandomIndex();
showQuote(currentIdx);
</script>
